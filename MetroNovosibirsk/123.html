<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Схема метро Новосибирска</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  .st-label { background: #fff; border: 1px solid #333; border-radius: 3px; padding: 1px 5px; font: 12px/1.25 Arial, sans-serif; white-space: nowrap; box-shadow: none; }
  .st-label .depth { color: #555; font-size: 11px; }
  .st-label.planned { border-style: dashed; color: #555; }
  .seg-label { display: inline-block; transform: translate(-50%, -50%); font: bold 11px Arial, sans-serif; color: #222; background: rgba(255,255,255,.85); border-radius: 3px; padding: 0 3px; white-space: nowrap; }
  .legend { background: #fff; padding: 10px 12px; font: 13px/1.6 Arial, sans-serif; border: 1px solid #999; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); max-width: 320px; }
  .legend h4 { margin: 0 0 6px; font-size: 14px; }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .line { width: 28px; height: 5px; border-radius: 2px; flex: none; }
  .legend svg { flex: none; }
  .legend .todo { margin-top: 8px; padding-top: 6px; border-top: 1px solid #ccc; color: #a00; font-size: 12px; }
  .title { background: #fff; padding: 6px 12px; font: bold 16px Arial, sans-serif; border: 1px solid #999; border-radius: 4px; }
   .leaflet-control-attribution {
    display: none !important;
  }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4"></script>
<script>
/* ===================== ДАННЫЕ ===================== */

// depth: глубина в метрах (число) или null — тогда подпись «мелкое заложение»
// planned: true — перспективная станция
// lat/lng: null — станция без координат, на карте не рисуется, попадает в список «Требуют уточнения»
const stations = {
  // Ленинская линия
  zaelc:  { name: "Заельцовская", lat: 55.0593, lng: 82.9124, depth: 12, planned: false },
  gagar:  { name: "Гагаринская", lat: 55.0511, lng: 82.9149, depth: 11, planned: false },
  krasn:  { name: "Красный проспект",  lat: 55.0410, lng: 82.9173, depth: 11, planned: false },
  lenin:  { name: "Площадь Ленина", lat: 55.0300, lng: 82.9205, depth: 11, planned: false },
  oktyab: { name: "Октябрьская", lat: 55.0188, lng: 82.9393, depth: 10, planned: false },
  rechn:  { name: "Речной вокзал", lat: 55.0088, lng: 82.9384, depth: 1, planned: false },
  sport:  { name: "Спортивная", lat: 54.9995, lng: 82.9230, depth: 7, planned: false  },
  stud:   { name: "Студенческая", lat: 54.9890, lng: 82.9065, depth: 7, planned: false },
  marx:   { name: "Площадь Маркса", lat: 54.9830, lng: 82.8936, depth: 11, planned: false },
  stan:  {name: "Площадь Станиславского", lat: 54.98194, lng: 82.87194, depth: null, planned: true },
  trol:  {name: "Троллейная", lat: 54.98141, lng: 82.85696, depth: null, planned: true },
  svaz:  {name: "Связистов" , lat: 54.98031, lng: 82.83434, depth: null, planned: true }, 
  slob:  {name: "Чистая Слобода" , lat: 54.98376, lng: 82.81087, depth: null, planned: true }, 
  zapad:  {name: "Западная" , lat: 54.99116, lng:  82.78582, depth: null, planned: true }, 
  centr:  {name: "Экспоцентр" , lat: 54.99655, lng: 82.74693, depth: null, planned: true }, 
  city:  {name: "Город Обь" , lat: 54.9945, lng: 82.69442, depth: null, planned: true }, 
  airport:  {name: "Аэропорт Толмачово" , lat: 55.00754, lng: 82.66749, depth: null, planned: true }, 
  sev:  { name: "Северная", lat: 55.07218, lng: 82.90913, depth: null, planned: true },
  avia:  { name: "Авиационная", lat: 55.08989, lng: 82.91196, depth: null, planned: true },
  space:  { name: "Космическая", lat: 55.10089, lng: 82.9230, depth: null, planned: true },
  springs:  { name: "Родники", lat:55.11748, lng: 82.93522, depth: null, planned: true },
  sand:  { name: "Песчаная", lat: 55.1298, lng: 82.95247, depth: null, planned: true },
  cranberry:  { name: "Клюквенная", lat: 55.1307, lng: 83.0001 , depth: null, planned: true },

  // Дзержинская линия
 acva:  { name: "Аквапарк", lat: 55.01823, lng: 82.8880, depth: null, planned: true },
 zaton:  { name: "Затон", lat: 55.01048, lng: 82.8757, depth: null, planned: true },
 trud:  { name: "Площадь Труда", lat: 54.99303, lng: 82.87019, depth: null, planned: true },
 stanis:  { name: "Площадь Станиславского", lat: 54.9804, lng: 82.871999, depth: null, planned: true },
 south:  { name: "Юго-Западная",  lat: 54.97104, lng: 82.87345, depth: null, planned: true },
 gvard:  { name: "Гвардейская", lat: 54.9641, lng: 82.9013, depth: null, planned: true },
 bugr:  { name: "Бугринская",  lat: 54.96108, lng: 82.9360, depth: null, planned: true },
 les:  { name: "Лесопарковая",  lat: 54.94349, lng: 82.9661, depth: null, planned: true },
 krasno:  { name: "Краснообск",  lat: 54.91952, lng: 82.97370, depth: null, planned: true },
  garin:  { name: "Площадь Гарина-Михайловского", lat: 55.0356, lng: 82.8977, depth: 13, planned: false },
  sibir:  { name: "Сибирская",         lat: 55.0420, lng: 82.9184, depth: 15, planned: false },
  pokr:   { name: "Маршала Покрышкина", lat: 55.0436, lng: 82.9354, depth: 13, planned: false },
  beroz:  { name: "Берёзовая роща",    lat: 55.0435, lng: 82.9524, depth: 13, planned: false },
  zniva:  { name: "Золотая Нива",      lat: 55.0378, lng: 82.9760, depth: 14, planned: false },
  mol: { name: "Молодёжная", lat: 55.03939, lng: 83.02294, depth: null, planned: true },
  gusin: { name: "Гусинобродская", lat: 55.0361, lng: 83.00251, depth: null, planned: true },

  // Первомайская линия
  petroz:  { name: "Петрозаводская",  lat: 55.12993, lng: 82.9015, depth: null, planned: true },
  rodni:  { name: "Родники",  lat: 55.112687, lng: 82.9338, depth: null, planned: true },
  sneg:  { name: "Снегири",  lat: 55.10558, lng: 82.95196, depth: null, planned: true },
  ybilei:  { name: "Юбилейная",  lat: 55.09679, lng: 82.9561, depth: null, planned: true },
  uchit:  { name: "Учительская",  lat: 55.0767, lng: 82.9582, depth: null, planned: true },
  vos:  { name: "Восточная", lat: 55.06759, lng: 82.9723, depth: null, planned: true },
  chkal:  { name: "Чкаловская",  lat: 55.0569, lng: 82.9771, depth: null, planned: true },
  ber:  { name: "Берёзовая Роща", lat: 55.0448, lng: 82.9530, depth: null, planned: true },
  kam:  { name: "Каменская", lat: 55.0238, lng: 82.9333, depth: null, planned: true },
  okt:  { name: "Октябрьская",   lat: 55.0184, lng: 82.9401, depth: null, planned: true },
  nik:  { name: "Никитинская",  lat: 55.0128, lng: 82.9534, depth: null, planned: true },
  dun:  { name: "Дунайская",  lat: 55.0077, lng: 82.9659, depth: null, planned: true },
  plu:  { name: "Плющихинская",  lat: 55.0078, lng: 82.9947, depth: null, planned: true },
  vib:  { name: "Выборная",  lat: 54.9999, lng: 83.01012, depth: null, planned: true },
  kami:  { name: "Камышенская",  lat: 54.9872, lng: 83.02062, depth: null, planned: true },
  kar:  { name: "Карьерная",   lat: 54.97962, lng: 83.01193, depth: null, planned: true },

  // Перспективные: вписать координаты и поставить в нужное место линии.
};

// Порядок станций на линиях. Перспективные станции добавляются в нужное место списка.
const lines = [
  { name: "Ленинская линия",    color: "#e53935",
    stations: ["cranberry", "sand", "springs", "space", "avia", "sev", "zaelc", "gagar", "krasn", "lenin", "oktyab", "rechn", "sport", "stud", "marx", "stan", "trol", "svaz", "slob", "zapad", "centr", "city", "airport"] },
  { name: "Дзержинская линия",  color: "#43a047",
    stations: ["krasno", "les", "bugr", "gvard", "south", "stanis", "trud", "zaton", "acva", "garin", "sibir", "pokr", "beroz", "zniva","gusin", "mol",] },
  {name: "Первомайская линия", color: "#0000ff",
    stations: ["petroz", "rodni", "sneg", "ybilei", "uchit", "vos", "chkal", "ber", "kam", "okt", "nik", "dun", "lu", "vib", "kami", "kar",]}
];

// Пересадки между разными станциями
const transfers = [
  ["krasn", "sibir"],
  ["oktyab", "okt"],
  ["beroz", "ber"],
  ["stan", "stanis"]
];

// Точная длина перегона в км, если известна, например: "zaelc-gagar": 1.20
const lengthOverride = {
};

/* ================================================== */

const map = L.map("map");
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
}).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const placed = id => stations[id] && stations[id].lat != null && stations[id].lng != null;

function dist(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtKm(km) { return km.toFixed(2).replace(".", ",") + " км"; }

const stColor = {};
lines.forEach(l => l.stations.forEach(id => { if (!stColor[id]) stColor[id] = l.color; }));
const isTransfer = {};
transfers.forEach(([a, b]) => { isTransfer[a] = true; isTransfer[b] = true; });

// Линии и перегоны
lines.forEach(l => {
  const ids = l.stations.filter(placed);
  for (let i = 0; i < ids.length - 1; i++) {
    const a = stations[ids[i]], b = stations[ids[i + 1]];
    const planned = a.planned || b.planned;
    L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
      color: l.color, weight: 6, opacity: planned ? 0.6 : 0.95,
      dashArray: planned ? "10 8" : null
    }).addTo(map);
    const km = lengthOverride[ids[i] + "-" + ids[i + 1]] ?? lengthOverride[ids[i + 1] + "-" + ids[i]] ?? dist(a, b);
    L.marker([(a.lat + b.lat) / 2, (a.lng + b.lng) / 2], {
      icon: L.divIcon({ className: "", html: '<span class="seg-label">' + fmtKm(km) + "</span>", iconSize: [0, 0] }),
      interactive: false
    }).addTo(map);
  }
});

// Переходы
transfers.forEach(([a, b]) => {
  if (!placed(a) || !placed(b)) return;
  L.polyline([[stations[a].lat, stations[a].lng], [stations[b].lat, stations[b].lng]],
    { color: "#000", weight: 4, dashArray: "4 4" }).addTo(map);
});

// Станции
const todo = [];
Object.keys(stations).forEach(id => {
  const s = stations[id];
  if (!placed(id)) { todo.push(s.name); return; }
  const color = stColor[id] || "#777";
  L.circleMarker([s.lat, s.lng], {
    radius: isTransfer[id] ? 9 : 6,
    color: isTransfer[id] ? "#000" : color,
    weight: 3,
    dashArray: s.planned ? "3 3" : null,
    fillColor: s.planned ? "#fff" : color,
    fillOpacity: 1
  }).addTo(map);
  const depthText = (typeof s.depth === "number") ? "глубина " + s.depth + " м" : "мелкое заложение";
  L.tooltip({ permanent: true, direction: "right", offset: [10, 0], className: "st-label" + (s.planned ? " planned" : "") })
    .setLatLng([s.lat, s.lng])
    .setContent("<b>" + s.name + "</b>" + (s.planned ? " (персп.)" : "") + '<br><span class="depth">' + depthText + "</span>")
    .addTo(map);
});

map.fitBounds(Object.keys(stations).filter(placed).map(id => [stations[id].lat, stations[id].lng]), { padding: [60, 60] });

// Заголовок
const title = L.control({ position: "topright" });
title.onAdd = () => { const d = L.DomUtil.create("div", "title"); d.innerHTML = "Схема метрополитена Новосибирска"; return d; };
title.addTo(map);

// Условные обозначения
const legend = L.control({ position: "bottomleft" });
legend.onAdd = function () {
  const div = L.DomUtil.create("div", "legend");
  let html = "<h4>Условные обозначения</h4>";
  lines.forEach(l => {
    html += '<div class="row"><span class="line" style="background:' + l.color + '"></span>' + l.name + "</div>";
  });
  html += '<div class="row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#777" stroke-width="5" stroke-dasharray="7 5"/></svg>Перспективный участок</div>';
  html += '<div class="row"><svg width="28" height="18"><circle cx="14" cy="9" r="6" fill="#777" stroke="#777" stroke-width="3"/></svg>Действующая станция</div>';
  html += '<div class="row"><svg width="28" height="18"><circle cx="14" cy="9" r="6" fill="#fff" stroke="#777" stroke-width="3" stroke-dasharray="3 3"/></svg>Перспективная станция</div>';
  html += '<div class="row"><svg width="28" height="22"><circle cx="14" cy="11" r="9" fill="#fff" stroke="#000" stroke-width="3"/></svg>Пересадочная станция</div>';
  html += '<div class="row"><svg width="28" height="10"><line x1="0" y1="5" x2="28" y2="5" stroke="#000" stroke-width="4" stroke-dasharray="4 4"/></svg>Переход между станциями</div>';
  html += '<div class="row"><span class="seg-label" style="transform:none">1,25 км</span>Длина перегона (по прямой)</div>';
  html += '<div class="row">Подпись под названием — глубина заложения</div>';
  if (todo.length) html += '<div class="todo">Требуют уточнения координат: ' + todo.join(", ") + "</div>";
  div.innerHTML = html;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
